<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1B2A4A">
<title>Offline – civicXindo</title>
<style>
  body{margin:0;font-family:"Noto Sans",system-ui,sans-serif;background:#FAF8F5;color:#5B6578;min-height:100vh;display:flex;flex-direction:column}
  .strip{background:#1B2A4A;color:#fff;font-size:12px;padding:6px 16px}
  .tri{height:3px;background:linear-gradient(90deg,#FF9933 0 33.3%,#fff 33.3% 66.6%,#138808 66.6%)}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;border:1px solid rgba(27,42,74,.08);border-radius:16px;box-shadow:0 1px 2px rgba(27,42,74,.04),0 8px 24px -8px rgba(27,42,74,.12);padding:32px;max-width:420px;text-align:center}
  h1{color:#1B2A4A;font-size:24px;margin:16px 0 8px}
  button{margin-top:24px;background:#1B2A4A;color:#fff;border:0;border-radius:12px;padding:12px 24px;font-size:16px;min-height:44px;cursor:pointer}
  p{line-height:1.6}
</style></head>
<body>
<div class="strip">Government of India | भारत सरकार</div><div class="tri"></div>
<main><div class="card">
  <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1B2A4A"/><circle cx="32" cy="32" r="22" fill="none" stroke="#fff" stroke-width="2.5"/><circle cx="32" cy="32" r="4.4" fill="none" stroke="#fff" stroke-width="2.2"/></svg>
  <h1>You are offline</h1>
  <p>This page has not been saved on this device yet. Your drafts and documents are safe. Please check your connection and try again.</p>
  <p lang="hi" style="font-size:1.05em">आप ऑफ़लाइन हैं। आपके ड्राफ़्ट और दस्तावेज़ सुरक्षित हैं।</p>

</div></main>
</body></html>
